# Builds the panel's image (the web app and both agents in it) for amd64 and arm64 and publishes it to
# GitHub's container registry as ghcr.io/atrello/bastion, tagged latest and with the VERSION file's version,
# on each push to main. deploy/compose.yaml uses it.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/atrello/bastion:latest
            ghcr.io/atrello/bastion:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
