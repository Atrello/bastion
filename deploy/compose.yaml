# The Bastion panel, behind your reverse proxy (Nginx Proxy Manager, Caddy, Traefik) which gives it HTTPS.
# See docs/install.md. Settings can go in a .env file beside this one, e.g. BASTION_PUBLIC_URL=https://bastion.example.com
services:
  bastion:
    build: ..
    image: bastion:latest
    restart: unless-stopped
    environment:
      # The address people and agents reach the panel at, with HTTPS.
      BASTION_PUBLIC_URL: ${BASTION_PUBLIC_URL:-https://bastion.home.lab}
      # The reverse proxy passes on the visitor's address, for sign-in limits.
      BASTION_TRUST_PROXY: ${BASTION_TRUST_PROXY:-true}
    volumes:
      - bastion-data:/data
    ports:
      # Only the reverse proxy should reach this. With the proxy on this host, the default (localhost) is
      # right; with it on another machine, set BASTION_BIND to this host's LAN address in .env, and let
      # only the proxy's address through the firewall to port 8080.
      - "${BASTION_BIND:-127.0.0.1}:8080:8080"

volumes:
  bastion-data:
