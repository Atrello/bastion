# The Bastion panel, behind your reverse proxy (Nginx Proxy Manager, Caddy, Traefik), which gives it HTTPS.
# Put this file and .env (copied from .env.example) in a folder, then: docker compose up -d
# The image is published from the repository (.github/workflows/image.yml); to build your own instead,
# run `docker build -t ghcr.io/atrello/bastion:latest .` in the repository first. See docs/install.md.
services:
  bastion:
    image: ghcr.io/atrello/bastion:${BASTION_VERSION:-latest}
    restart: unless-stopped
    environment:
      BASTION_PUBLIC_URL: ${BASTION_PUBLIC_URL:?set BASTION_PUBLIC_URL in .env}
      BASTION_TRUST_PROXY: ${BASTION_TRUST_PROXY:-true}
      BASTION_SESSION_IDLE: ${BASTION_SESSION_IDLE:-12h}
      BASTION_DNS_FALLBACK: ${BASTION_DNS_FALLBACK:-1.1.1.1,9.9.9.9}
    volumes:
      - bastion-data:/data
    ports:
      # Only the reverse proxy should reach this: see BASTION_BIND in .env.example.
      - "${BASTION_BIND:-127.0.0.1}:${BASTION_PORT:-8080}:8080"

volumes:
  bastion-data:
